# this_file: src_docs/mkdocs.yml
site_name: vexy-stax-js
site_description: Browser renderer for the vexy-stax scene format - 3D glass plates in two views, as ESM, Web Component and classic-script global
site_url: https://vexy.dev/vexy-stax-js/
repo_url: https://github.com/vexyart/vexy-stax-js
repo_name: vexyart/vexy-stax-js
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Live demos: live-demos.md
  - Reference:
      - Web Component: web-component.md
      - ESM API: api.md
      - Scene format: scene-format.md
  - Project:
      - Architecture: architecture.md
      - Contributing: contributing.md
