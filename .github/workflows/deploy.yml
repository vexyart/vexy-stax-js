# this_file: vexy-stax-js/.github/workflows/deploy.yml
name: Deploy to Github Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get version from tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json version
        if: steps.version.outputs.version != 'dev'
        # --allow-same-version: the tag (v3.1.2) may already match package.json (we commit the
        # bumped version), and plain `npm version X` errors "Version not changed" otherwise,
        # which used to fail the whole deploy and block GitHub Pages.
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Just the dist bundles. We do NOT regenerate docs/ here: scripts/build-docs.mjs copies
        # slides/scene from the sibling vexy-stax-py package, which is NOT checked out in this
        # JS-only repo. The committed docs/ is self-contained (bundles + slides + scenes + HTML)
        # — regenerate it locally with `npm run build:docs` (or build.sh) and commit before tagging.
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
